# Build, test and deploy dev2ops learn.
#
# Every push and pull request: build, build checks and a browser test.
# Pushes to main also deploy: dist/ is rsynced to the web host over SSH with a
# key the host restricts to rsync inside /srv/dev2ops-learn (deploy/setup-server.sh).
#
# Secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST         IP or hostname of the web host
#   DEPLOY_SSH_KEY      private key of the `learn` deploy user
#   DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan -t ed25519 <host>`
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # "last updated" dates on lessons come from git history
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::warning::Deploy secrets are not set; skipping deploy."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -rlz --delete --delay-updates --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes" \
            dist/ "learn@${DEPLOY_HOST}:site/"
          echo "Deployed $(git rev-parse --short HEAD)"

      - name: Smoke test
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true # the host may still be served by the old setup
        run: curl -fsS --max-time 20 -o /dev/null -w "%{http_code} %{url}\n" "$(node -p "require('./site.config.json').url")/"
