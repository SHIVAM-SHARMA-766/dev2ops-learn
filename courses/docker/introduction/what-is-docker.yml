title: What is Docker?
summary: Why containers exist — watch an app get packaged and shipped.
minutes: 8
difficulty: beginner
order: 1

scene:
  widget: shipScene

steps:
  - kind: RECAP
    title: Start with your code
    body: >
      Last lesson we saw the problem: code that works on your laptop breaks
      elsewhere, because the **environment** differs. Docker's fix starts here,
      with **your code** — the program you wrote.
    label: Your code
    callout:
      kind: KEY IDEA
      text: The code is rarely the problem. The environment around it is.

  - kind: CONCEPT
    title: Add the whole environment
    label: + runtime & libs
    body: >
      So we bundle more than the code: the exact **runtime** and **libraries** it
      needs. Everything the app depends on, gathered in one place.

  - kind: CONCEPT
    title: Seal it into an image
    label: → image
    body: >
      Those pieces seal into an **image** — a read-only, reproducible bundle. Build
      it once and it carries its whole environment with it.
    callout:
      kind: ANALOGY
      text: An image is like a shipping container — a standard box that fits on any ship, train or truck.

  - kind: CONCEPT
    title: Ship it anywhere
    label: ship it
    body: >
      Copy that image to your laptop, a server, a CI runner — anywhere. The same
      sealed bytes travel to each.

  - kind: CONCEPT
    title: It runs the same everywhere
    label: runs identically
    body: >
      Each target starts the image as a **container** — an isolated process — and
      because the environment came along inside the image, it behaves **identically**
      on every machine.
    callout:
      kind: REMEMBER
      text: Build once, run anywhere. That identical-everywhere promise is the whole point of Docker.

quiz:
  - question: What does packaging an app as an image actually solve?
    options:
      - It makes the code shorter
      - It carries the app's environment so it runs identically everywhere
      - It encrypts the app
      - It speeds up the CPU
    answer: 1
    explanation: The image bundles the runtime and libraries, eliminating environment drift between machines.
  - question: A running instance of an image is called a…
    options: ["container", "volume", "registry", "layer"]
    answer: 0
    explanation: An image is the sealed template; a container is a running instance of it.
