title: Why not just a VM?
summary: Watch where a VM's weight goes — and why containers travel light.
minutes: 6
difficulty: beginner
order: 2

scene:
  widget: vmVsContainer

steps:
  - kind: CONCEPT
    title: Both start with hardware
    label: Hardware
    body: >
      A VM and a container both end up running your app on the same physical
      machine. The difference is **how much they stack on top** of the hardware to
      get there.

  - kind: CONCEPT
    title: A VM brings a whole OS
    label: One VM
    body: >
      A virtual machine runs a **hypervisor**, and on top of it a full **guest
      OS** — its own kernel — just to run one app. That's gigabytes and tens of
      seconds to boot.
    callout:
      kind: NOTICE
      text: Every VM carries its own operating system. That's where the weight comes from.

  - kind: CONCEPT
    title: Each VM repeats that weight
    label: Two VMs
    body: >
      Want a second app isolated? Another **entire OS**. The host fills up fast —
      a laptop handles only a few VMs before it strains.

  - kind: CONCEPT
    title: Containers share the kernel
    label: Containers
    body: >
      Containers skip all that. They share the **host's single kernel** and add
      only your app — megabytes, up in milliseconds. One kernel, many isolated
      processes.
    callout:
      kind: KEY IDEA
      text: No second OS to boot. That's why a container starts in a blink and a VM takes seconds.

  - kind: CONCEPT
    title: So you can run many
    label: Many
    body: >
      Because each container is light, dozens run happily where only a few VMs
      would fit. Same isolation goal, a fraction of the cost.
    callout:
      kind: TL;DR
      text: VM = own kernel, heavy, few. Container = shared kernel, light, many.

quiz:
  - question: Why does a container start so much faster than a VM?
    options:
      - It has fewer files
      - It doesn't boot its own OS kernel — it shares the host's
      - It skips networking
      - It runs on a faster CPU
    answer: 1
    explanation: No guest OS to boot — a container is just a process on the host kernel.
  - question: What mainly makes a VM "heavy"?
    options:
      - The app
      - It carries a full guest operating system
      - The hypervisor name
      - Its IP address
    answer: 1
    explanation: Each VM ships and boots its own OS kernel; containers share the host's.
