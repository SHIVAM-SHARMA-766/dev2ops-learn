title: Docker Swarm in a nutshell
summary: Watch a manager spread replicas across a cluster of workers.
minutes: 8
difficulty: advanced
order: 1

scene:
  widget: packetJourney
  nodes:
    - { id: manager, icon: settings, label: manager, sub: desired state, x: 28, y: 22 }
    - { id: w1, icon: box, label: worker 1, sub: 2 replicas, x: 14, y: 74 }
    - { id: w2, icon: box, label: worker 2, sub: 2 replicas, x: 48, y: 74 }
    - { id: w3, icon: box, label: worker 3, sub: 1 replica, x: 82, y: 74 }
  path: [manager, w1, manager, w2, manager, w3]

steps:
  - kind: CONCEPT
    title: One brain, many machines
    label: Manager
    body: >
      `docker swarm init` turns a machine into a **manager** that holds the
      *desired state* — "run 5 copies of web". Other machines `docker swarm join`
      as **workers** that run containers.

  - kind: CONCEPT
    title: Declare a service
    label: Service
    body: >
      You don't start containers by hand — you declare a **service**:
      `docker service create --replicas 5 web`. The manager spreads those replicas
      (tasks) across the workers.
    callout:
      kind: KEY IDEA
      text: You describe the end state; Swarm figures out where each replica runs.

  - kind: CONCEPT
    title: Spread across the cluster
    label: Spread
    body: >
      The manager places replicas on worker 1, worker 2, worker 3 — balancing the
      load across the whole cluster automatically.

  - kind: CONCEPT
    title: Self-healing
    label: Self-heals
    body: >
      A worker dies and its replicas vanish? The manager notices the gap between
      desired (5) and actual (3) and **reschedules** the missing ones onto healthy
      workers. No pager needed.

  - kind: CONCEPT
    title: Stacks = Compose for clusters
    label: Stacks
    body: >
      `docker stack deploy -c compose.yaml myapp` deploys a whole Compose file to
      the swarm as services — the same YAML you know, now across many hosts.
    callout:
      kind: NICE
      text: Swarm is simple and ships with Docker — a gentle first taste of orchestration.

quiz:
  - question: What does a Swarm manager do when a worker fails?
    options:
      - Nothing
      - Reschedules the lost replicas onto healthy workers to match desired state
      - Emails you
      - Shuts down the service
    answer: 1
    explanation: Swarm continuously reconciles actual vs desired state, rescheduling lost replicas.
