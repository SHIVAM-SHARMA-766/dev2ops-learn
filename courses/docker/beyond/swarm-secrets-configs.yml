title: Secrets & configs in Swarm
summary: Ship passwords and config to services without baking them in.
minutes: 7
difficulty: advanced
order: 3

scene:
  widget: terminalReplay
  blocks:
    - cmd: printf 's3cr3t' | docker secret create db_pass -
      out: |
        8f3a9c…   (stored encrypted in the swarm's raft log)
    - cmd: docker service create --name db --secret db_pass postgres:16
      out: |
        (secret appears at /run/secrets/db_pass inside the container — tmpfs, in RAM)
    - cmd: docker config create nginx_conf ./nginx.conf
      out: |
        2b7d4e…
    - cmd: docker service create --name web --config src=nginx_conf,target=/etc/nginx/nginx.conf nginx
      out: |
        (config file mounted into the service, versioned by the swarm)

steps:
  - kind: PROBLEM
    title: Secrets don't belong in images or env
    label: The problem
    body: >
      You've learned: don't bake secrets into layers, and env vars are visible via
      `inspect`. So how do you get a database password to a running service
      safely? Swarm has a built-in answer.

  - kind: CONCEPT
    title: docker secret
    label: secret
    body: >
      `docker secret create` stores a value **encrypted** in the swarm's raft log.
      It's never written to disk on the worker — it's mounted into the container
      at `/run/secrets/<name>` on an in-memory filesystem.
    callout:
      kind: KEY IDEA
      text: Secrets live encrypted at rest and appear only in RAM inside the containers that need them.

  - kind: CONCEPT
    title: Grant it per service
    label: --secret
    body: >
      Attach a secret to just the services that need it with `--secret`. The app
      reads the file at `/run/secrets/db_pass` — no env var, no image rebuild, no
      leak.

  - kind: CONCEPT
    title: docker config for non-secrets
    label: config
    body: >
      `docker config` works the same way for **non-secret** files — nginx configs,
      feature flags. Versioned and distributed by the swarm, mounted where you
      ask. Change config without rebuilding the image.
    callout:
      kind: PARALLEL
      text: Kubernetes has the same idea as Secrets and ConfigMaps — the pattern carries over.

quiz:
  - question: Where does a Swarm secret appear inside the container?
    options:
      - In an environment variable
      - As a file under /run/secrets, on an in-memory filesystem
      - Baked into a layer
      - In the image metadata
    answer: 1
    explanation: Swarm mounts secrets as files in a tmpfs at /run/secrets — encrypted at rest, in RAM at runtime.
