title: Images are stacks of layers
summary: Watch an image build up, layer by layer, with the writable layer on top.
minutes: 8
difficulty: beginner
order: 2

scene:
  widget: layers3d
  caption: Each instruction adds a read-only layer; the container writes to the top one.
  layers:
    - { label: base — debian, sub: shared }
    - { label: + node runtime, sub: shared }
    - { label: + dependencies, sub: npm ci }
    - { label: + your app code, sub: changes often }
  writable: { label: container writable layer }
  copyUp: true

steps:
  - kind: CONCEPT
    title: Start from a base layer
    label: base
    body: >
      Every image begins with a **base layer** — here, Debian. It's read-only, and
      shared: every image built `FROM debian` reuses this exact layer.

  - kind: CONCEPT
    title: Each instruction adds a layer
    label: + runtime
    body: >
      Install the Node runtime and that becomes the **next layer**, stacked on top.
      Docker stores each layer once and stacks them with a union filesystem.

  - kind: CONCEPT
    title: Layers are cached and shared
    label: + deps
    body: >
      Your `npm ci` adds a dependencies layer. Because layers are
      content-addressed, identical layers are **never downloaded or stored twice**
      — that's why your second pull is suddenly fast.
    callout:
      kind: KEY IDEA
      text: Order least-changing first. Change your code and only the top layers rebuild.

  - kind: CONCEPT
    title: Your code on top
    label: + code
    body: >
      Finally your **app code** — the layer that changes on almost every build, so
      it sits highest where it busts the least cache.

  - kind: CONCEPT
    title: The container adds a writable layer
    label: writable
    body: >
      Run the image and Docker adds a thin **writable layer** on top. All the image
      layers stay read-only; everything the running container writes lands here.
    callout:
      kind: FORESHADOW
      text: This writable layer vanishes when the container is removed — which is why data needs a volume.

  - kind: CONCEPT
    title: Editing a lower file copies it up
    label: copy-up
    body: >
      Change a file that lives in a lower, read-only layer and Docker must **copy
      it up** into the writable layer first. It's why heavy writes are slow and
      belong in a volume, not the container's filesystem.
    callout:
      kind: REMEMBER
      text: Read-only image layers + one writable layer = a container's disk.

quiz:
  - question: Why is pulling a second image based on the same OS much faster?
    options:
      - Docker compresses it better
      - The shared base layers are already downloaded
      - It skips the download
      - The image is smaller
    answer: 1
    explanation: Layers are cached and shared — only the new, unique layers are pulled.
  - question: Where do a running container's writes go?
    options:
      - Into the image's base layer
      - Into the thin writable layer on top
      - Into the registry
      - Nowhere
    answer: 1
    explanation: Image layers are read-only; writes land in the container's writable layer (and vanish with it).
