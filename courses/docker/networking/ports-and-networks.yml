title: Ports & container networks
summary: How the outside reaches in, and how containers find each other.
minutes: 8
difficulty: beginner
order: 1

scene:
  widget: diagram
  nodes:
    - { id: browser, label: Browser, sub: your laptop, x: 14, y: 22 }
    - { id: host, label: "Host :8080", sub: "-p 8080:80", x: 14, y: 68 }
    - { id: web, label: web, sub: ":80", x: 48, y: 68 }
    - { id: db, label: db, sub: ":5432", x: 82, y: 68 }
  edges:
    - [browser, host]
    - [host, web]
    - [web, db]
  active:
    - [browser, host]
    - [host, web]
    - [web, db]
    - [browser, host, web, db]

steps:
  - kind: CONCEPT
    title: Containers are closed by default
    label: Closed
    body: >
      A container's ports are **not** reachable from your machine unless you say
      so. By default it's sealed — which is a good default.

  - kind: CONCEPT
    title: Publish a port to open a door
    label: Publish
    body: >
      `-p 8080:80` tells Docker: traffic arriving on the **host's** 8080 should be
      forwarded to port **80 inside** the container. Now `localhost:8080` reaches
      `web`.
    callout:
      kind: DIRECTION
      text: Only published ports are reachable from outside. Everything else stays private.

  - kind: CONCEPT
    title: Containers talk by name
    label: By name
    body: >
      Put containers on the **same user-defined network** and they reach each
      other by **name** — `web` connects to `db` at the hostname `db:5432`. No IPs,
      no `-p` needed; that traffic never leaves the network.
    callout:
      kind: KEY IDEA
      text: Publish ports for the *outside* world; use the shared network for *container-to-container*.

  - kind: CONCEPT
    title: The whole picture
    label: Full path
    body: >
      Browser → host:8080 → web:80 → db:5432. The browser only ever sees the one
      published port; `db` stays completely private inside the network.
    callout:
      kind: COMPOSE
      text: Docker Compose creates this shared network for you automatically — that's next.

quiz:
  - question: Container `web` needs to reach `db`. What's required?
    options:
      - Publish db's port with -p
      - Put them on the same network and use the name "db"
      - Nothing, all containers can talk
      - A bind mount
    answer: 1
    explanation: Same user-defined network → containers resolve each other by name, no port publishing needed.
  - question: What does `-p` actually expose?
    options:
      - A port to other containers
      - A port to the host / outside world
      - A volume
      - An environment variable
    answer: 1
    explanation: "-p publishes a container port to the host so the outside world can reach it."
