title: Secrets & scanning
summary: Keep credentials out of images, and know your CVEs before shipping.
minutes: 8
difficulty: intermediate
order: 2

scene:
  widget: terminalReplay
  blocks:
    - cmd: docker history myapp:latest | grep -i key
      out: |
        <missing>  RUN echo "API_KEY=sk-live-9f3…" > .env   # 😱 baked into a layer forever
    - cmd: docker scout cves myapp:latest
      out: |
        ✓ Image:  myapp:latest
        ✗ 2 critical, 5 high, 11 medium
        CVE-2024-XXXX  openssl  critical  → fixed in 3.0.14
    - cmd: docker build --secret id=npm,src=.npmrc -t myapp .
      out: |
        #8 [auth] using secret 'npm' (not stored in any layer)
        => exporting to image   done
    - cmd: docker run --env-file .env myapp
      out: |
        (secrets injected at runtime, never built into the image)

steps:
  - kind: PROBLEM
    title: Secrets leak into layers
    label: The leak
    body: >
      `COPY`-ing or `echo`-ing a key into the image bakes it into a **layer**. Even
      if a later step deletes the file, the layer still contains it — and anyone
      who pulls the image can dig it out.
    callout:
      kind: REMEMBER
      text: Deleting a secret in a later layer does NOT remove it from the earlier one.

  - kind: TOOL
    title: Scan for vulnerabilities
    label: scout cves
    body: >
      `docker scout cves` (or Trivy, Grype) lists known CVEs in your image's
      packages. Make it part of CI and fail the build on criticals. A smaller base
      image means fewer packages and fewer CVEs.

  - kind: CONCEPT
    title: Build secrets, not baked secrets
    label: --secret
    body: >
      Need a private token **at build time** (private npm, pip)? Use BuildKit's
      `--secret`. It's mounted for that one step and **never written to a layer**.

  - kind: CONCEPT
    title: Runtime secrets via env / mounts
    label: Runtime
    body: >
      For runtime config, inject with `--env-file`, Docker/Swarm secrets, or your
      orchestrator's secret store — so the image stays generic and shareable.
    callout:
      kind: RULE
      text: Images are public artefacts. Secrets belong at build-mount or runtime, never in a layer.

quiz:
  - question: You COPY a .env with a key, then delete it in the next line. Is the key safe?
    options:
      - Yes, it's deleted
      - "No — it still exists in the earlier layer"
      - Only if you squash
      - Yes, if the image is private
    answer: 1
    explanation: Each layer is immutable; the secret lives in the layer that added it, regardless of later deletes.
