title: Make images tiny
summary: Watch the base shrink — full, slim, alpine, distroless, scratch.
minutes: 8
difficulty: intermediate
order: 8

scene:
  widget: sizeScale
  items:
    - { label: "node:20", mb: 1000, note: full Debian + tools }
    - { label: "node:20-slim", mb: 200, note: trimmed Debian }
    - { label: "node:20-alpine", mb: 130, note: musl, tiny }
    - { label: "distroless", mb: 25, note: runtime only, no shell }
    - { label: "scratch", mb: 0, note: empty — static binary }

steps:
  - kind: PROBLEM
    title: The full image is huge
    label: "node:20"
    body: >
      The friendly `node:20` is a full Debian with a shell, package manager and
      build tools — around a **gigabyte**. Easy to debug, but that's a lot to pull,
      store and keep patched.
    callout:
      kind: WHY IT MATTERS
      text: Size is attack surface — more packages means more potential CVEs.

  - kind: CONCEPT
    title: slim trims the fat
    label: slim
    body: >
      `-slim` drops docs and extras from Debian — roughly a fifth of the size.
      Still has a shell and apt, so it's an easy first win with no real downside.

  - kind: CONCEPT
    title: alpine goes smaller
    label: alpine
    body: >
      `-alpine` is built on tiny Alpine Linux (musl libc) — much smaller again.
      Just test: musl occasionally trips up prebuilt native modules.

  - kind: CONCEPT
    title: distroless — runtime only
    label: distroless
    body: >
      **distroless** keeps only your language runtime and app — no shell, no
      package manager. Tiny and hard to exploit. Pair it with a multi-stage build:
      build in a full image, copy the result into distroless.

  - kind: CONCEPT
    title: scratch — nothing at all
    label: scratch
    body: >
      For a static binary (Go, Rust), `FROM scratch` is an **empty** base — your
      binary is the whole image. Can't get smaller. Can't `exec` a shell in
      either, so debug elsewhere.
    callout:
      kind: TRADE-OFF
      text: Smaller = safer + faster, harder to debug. Distroless is a great middle ground.

quiz:
  - question: Why is a smaller base image a security benefit?
    options:
      - It encrypts the app
      - Fewer packages means a smaller attack surface and fewer CVEs
      - It runs as non-root automatically
      - It signs the image
    answer: 1
    explanation: Less software in the image = less that can have a vulnerability.
  - question: What's notable about a distroless or scratch image for debugging?
    options:
      - It has extra tools
      - It has no shell, so you can't exec a shell into it
      - It can't run apps
      - It's read-only
    answer: 1
    explanation: No shell/package manager means debugging happens outside the running container.
