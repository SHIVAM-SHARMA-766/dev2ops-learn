title: Where did my data go?
summary: Watch data vanish with a container — then watch a volume save it.
minutes: 7
difficulty: beginner
order: 1

scene:
  widget: volumeScene

steps:
  - kind: STORY
    title: The container writes data
    label: Writes
    body: >
      You run a database and it writes its data. By default that data lives in the
      container's own **writable layer** — inside the container itself.

  - kind: PROBLEM
    title: Remove it — and it's gone
    label: 💀 gone
    body: >
      Later you `docker rm -f` the container to recreate it with new settings.
      Routine. But the writable layer went **with** it — the data never existed
      anywhere else. This bites everyone exactly once.
    callout:
      kind: THE RULE
      text: A container's filesystem is disposable. Remove the container, remove its data.

  - kind: CONCEPT
    title: Put the data in a volume
    label: Volume
    body: >
      The fix: store the data in a **volume** — storage that lives **outside** the
      container, managed by Docker. The container writes to it, but it isn't part
      of the container.

  - kind: CONCEPT
    title: Now removal is safe
    label: ✓ survives
    body: >
      Remove the container now and the **volume stays**. Your data is untouched,
      sitting safely outside the disposable container.
    callout:
      kind: KEY IDEA
      text: Containers are cattle, not pets. Volumes are where the state you care about lives.

  - kind: CONCEPT
    title: Reconnect and carry on
    label: Re-attach
    body: >
      Start a **fresh** container with the same volume and the data is right there.
      Upgrade the image, change settings, recreate freely — the data persists
      across all of it.

quiz:
  - question: Why did the data disappear when the container was removed?
    options:
      - The database crashed
      - It lived in the container's writable layer, removed with the container
      - The password was wrong
      - Docker deleted it on purpose
    answer: 1
    explanation: No volume = data in the ephemeral writable layer, gone when the container is removed.
  - question: What makes data survive a container being recreated?
    options:
      - Nothing, it always survives
      - Storing it in a volume, outside the container
      - A bigger image
      - Running as root
    answer: 1
    explanation: A volume lives outside the container's lifecycle, so the data persists across recreation.
