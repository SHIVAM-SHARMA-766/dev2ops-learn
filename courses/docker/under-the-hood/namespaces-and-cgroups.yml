title: The two kernel features behind containers
summary: Watch an ordinary process get walled off, then capped.
minutes: 8
difficulty: intermediate
order: 2

scene:
  widget: isolationBox

steps:
  - kind: CONCEPT
    title: It starts as an ordinary process
    label: process
    body: >
      There is no "container" object in Linux. A container begins as a plain
      process — the kernel just wraps it in two kinds of feature. Watch them get
      added one by one.

  - kind: CONCEPT
    title: PID namespace — its own process tree
    label: PID ns
    body: >
      The first wall: a **PID namespace**. Inside, the process sees only its own
      process tree — it's PID 1 and can't see the host's processes at all.

  - kind: CONCEPT
    title: Network namespace — its own stack
    label: NET ns
    body: >
      A **network namespace** gives it private interfaces, its own IP and routing
      table. It feels like it has its own network card.

  - kind: CONCEPT
    title: Mount namespace — its own filesystem
    label: MNT ns
    body: >
      A **mount namespace** gives it its own filesystem view — the image, not the
      host's disk. Same kernel, a completely separate world.
    callout:
      kind: KEY IDEA
      text: Namespaces = isolation. Same kernel, separate views of PIDs, network, mounts, users.

  - kind: CONCEPT
    title: User namespace — safe root
    label: USER ns
    body: >
      A **user namespace** can map "root" inside the container to an unprivileged
      user on the host. Now the box is fully sealed — isolated, cheaply, with no
      second OS.

  - kind: CONCEPT
    title: cgroups — cap what it can use
    label: cgroups
    body: >
      Isolation says what it can **see**; **cgroups** say what it can **use** —
      CPU, memory, I/O, process count. The meter fills to a limit and stops there.
      That's what `--memory` and `--cpus` configure.
    callout:
      kind: REMEMBER
      text: Namespaces (what you see) + cgroups (what you use) = a container. No magic, just the kernel.

quiz:
  - question: Which kernel feature limits how much memory a container can use?
    options: ["Namespaces", "cgroups", "The image", "runc"]
    answer: 1
    explanation: cgroups (control groups) enforce resource limits; namespaces handle isolation.
  - question: Why does a container see only its own processes?
    options:
      - It has its own kernel
      - A PID namespace gives it a private process tree
      - Docker hides them in the CLI
      - The host blocks ps
    answer: 1
    explanation: The PID namespace isolates the process tree — same kernel, separate view.
