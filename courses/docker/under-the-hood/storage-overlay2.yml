title: How layers are stored on disk
summary: overlay2's lowerdir, upperdir and the copy-up trick — on screen.
minutes: 7
difficulty: advanced
order: 4

scene:
  widget: layerStack
  caption: overlay2 stacks read-only lowerdirs under one writable upperdir, merged into one view.
  layers:
    - { label: lowerdir — base image, sub: read-only }
    - { label: lowerdir — app layers, sub: read-only }
  writable: { label: upperdir — the container layer }
  copyUp: true

steps:
  - kind: CONCEPT
    title: Read-only image layers (lowerdir)
    label: lowerdir
    body: >
      The image layers become **lowerdir** — read-only, stacked oldest to newest.
      overlay2 is the storage driver that stitches them together.

  - kind: CONCEPT
    title: More lowerdirs stack up
    label: more lower
    body: >
      Every image layer is another lowerdir in the stack. None of them is ever
      modified — they're shared, read-only, content-addressed.

  - kind: CONCEPT
    title: One writable layer on top (upperdir)
    label: upperdir
    body: >
      On top sits a single **upperdir** — the container's writable layer.
      Everything the container writes goes here; the lowerdirs are untouched. The
      container sees a single **merged** view of lower + upper.
    callout:
      kind: KEY IDEA
      text: Many read-only lowerdirs + one writable upperdir, unioned into one filesystem.

  - kind: CONCEPT
    title: Copy-up on write
    label: copy-up
    body: >
      Modify a file that lives in a lowerdir and overlay2 must **copy it up** into
      upperdir first, then write. For large files that's slow and grows the
      writable layer — which is why heavy writes belong in a volume.
    callout:
      kind: TIE-IN
      text: This is the mechanism behind "data in the writable layer is slow and disposable".

quiz:
  - question: Where do a container's writes go under overlay2?
    options:
      - Into the image layers (lowerdir)
      - Into the single writable upperdir
      - Into a volume automatically
      - Nowhere
    answer: 1
    explanation: Image layers are read-only lowerdirs; all writes land in the container's upperdir.
  - question: What is "copy-up"?
    options:
      - Uploading an image
      - Copying a lowerdir file into upperdir before modifying it
      - Backing up a volume
      - Pushing to a registry
    answer: 1
    explanation: To modify a read-only lowerdir file, overlay2 copies it up to the writable upperdir first.
