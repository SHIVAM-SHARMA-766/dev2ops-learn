title: Docker isn't the only way
summary: The same image runs under many tools — thanks to open standards.
minutes: 7
difficulty: advanced
order: 5

scene:
  widget: iconReveal
  caption: Different tools, the same OCI images and registries.
  items:
    - { logo: docker, label: Docker, note: the familiar toolset }
    - { icon: box, label: containerd, note: the runtime }
    - { icon: cpu, label: runc, note: talks to the kernel }
    - { logo: kubernetes, label: Kubernetes, note: drives the same runtime }
    - { icon: terminal-2, label: Podman / nerdctl, note: same images, no daemon }

steps:
  - kind: CONCEPT
    title: Docker is a product — the format is a standard
    label: Docker
    body: >
      "Docker" is a company and a toolset. But the **formats** are open standards
      from the **Open Container Initiative (OCI)**: how an image is laid out, how
      it's run, and how registries serve it.

  - kind: CONCEPT
    title: containerd does the real work
    label: containerd
    body: >
      Under Docker sits **containerd** — a full container runtime that supervises
      the lifecycle. It's a standard component you can use directly, not just via
      Docker.

  - kind: CONCEPT
    title: runc talks to the kernel
    label: runc
    body: >
      containerd calls **runc**, a tiny OCI runtime that creates the isolated
      process with namespaces and cgroups. The low-level piece we met earlier.

  - kind: CONCEPT
    title: Kubernetes uses the same stack
    label: Kubernetes
    body: >
      **Kubernetes** doesn't need Docker — it drives **containerd** directly to
      run pods. Your Docker-built image runs there unchanged.
    callout:
      kind: KEY IDEA
      text: You build to the OCI standard, not to Docker. That's what makes "runs anywhere" true.

  - kind: CONCEPT
    title: Other tools, same images
    label: Alternatives
    body: >
      **Podman**, **Buildah** and **nerdctl** build and run the very same OCI
      images and registries — some without a daemon at all. Learn the model, and
      every container tool feels familiar.

quiz:
  - question: Why can a Docker-built image run on Kubernetes or Podman?
    options:
      - Luck
      - It follows the open OCI specs that all of them implement
      - They convert it
      - It can't
    answer: 1
    explanation: Images are OCI artefacts; any OCI-compliant runtime can run them.
  - question: What does Kubernetes use to actually run containers?
    options: ["Docker Desktop", "containerd (a runtime)", "a web server", "nothing"]
    answer: 1
    explanation: Kubernetes drives containerd (via the CRI) to run pods — the same runtime under Docker.
