title: What happens when you type docker run
summary: The CLI, the daemon, containerd, runc — who does what.
minutes: 8
difficulty: intermediate
order: 1

scene:
  widget: diagram
  nodes:
    - { id: cli, label: docker CLI, sub: you type, x: 12, y: 28 }
    - { id: daemon, label: dockerd, sub: the daemon, x: 40, y: 28 }
    - { id: registry, label: registry, sub: docker pull, x: 40, y: 72 }
    - { id: containerd, label: containerd, sub: tracks containers, x: 68, y: 28 }
    - { id: runc, label: runc, sub: spawns it, x: 90, y: 28 }
    - { id: container, label: container, sub: your process, x: 90, y: 72 }
  edges:
    - [cli, daemon]
    - [daemon, registry]
    - [daemon, containerd]
