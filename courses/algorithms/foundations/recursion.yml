title: Recursion & the call stack
summary: A function that calls itself — and the stack that remembers each call.
minutes: 8
difficulty: beginner
order: 2

scene:
  widget: stagedReveal
  caption: Each call waits on the next; the stack unwinds bottom-up.
  items:
    - label: factorial(4)
      note: waits for 4 × factorial(3)
      tag: push
    - label: factorial(3)
      note: waits for 3 × factorial(2)
      tag: push
    - label: factorial(2)
      note: waits for 2 × factorial(1)
      tag: push
    - label: factorial(1)
      note: base case → returns 1
      tag: base
    - label: unwind → 24
      note: 2×1, 3×2, 4×6 = 24
      tag: pop

steps:
  - kind: CONCEPT
    title: A function that calls itself
    label: Recursion
    body: >
      **Recursion** solves a problem by solving a smaller version of the same
      problem. Every recursion needs two things: a **base case** (when to stop)
      and a **recursive case** (how to shrink).

  - kind: STEP
    title: Calls pile up
    label: Push
    body: >
      `factorial(4)` can't finish — it needs `factorial(3)`, which needs
      `factorial(2)`… Each **pending** call is pushed onto the **call stack**,
      waiting.
    callout:
      kind: KEY IDEA
      text: The call stack remembers every in-progress call — that's how it knows where to return.

  - kind: STEP
    title: The base case stops it
    label: Base case
    body: >
      `factorial(1)` is the **base case** — it returns 1 without recursing. Without
      it, the stack grows forever: a **stack overflow**.

  - kind: STEP
    title: The stack unwinds
    label: Unwind
    body: >
      Now answers flow back up: 1 → 2×1 → 3×2 → 4×6 = **24**. Each call takes the
      result below it and returns, popping off the stack.

  - kind: NOTICE
    title: Power and cost
    label: Cost
    body: >
      Recursion is elegant for trees, divide-and-conquer and backtracking. But
      each call costs stack space — deep recursion can overflow, and naive
      recursion can repeat work (that's where dynamic programming comes in).

quiz:
  - question: What does every recursion need to avoid running forever?
    options:
      - A loop
      - A base case that stops the recursion
      - A global variable
      - More memory
    answer: 1
    explanation: The base case returns without recursing; without it the stack overflows.
  - question: What does the call stack store?
    options:
      - The final answer
      - Each in-progress (pending) call, so it knows where to return
      - The input array
      - Nothing
    answer: 1
    explanation: Every not-yet-finished call sits on the stack until the one below it returns.
